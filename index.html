<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miyuki 余美雪｜教學・探索・連結</title>
  <meta name="description" content="余美雪的教學空間：一起探索資訊科技、AI與世界。">
  <style>
    :root {
      color-scheme: dark;
      --ink: #e6edf7;
      --green: #67e8dc;
      --paper: #080e19;
      --muted: #98a9bf;
      --line: #203149;
      --panel: #0e1929;
      --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 30px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: radial-gradient(ellipse at 80% 12%, #12344660, transparent 36%), var(--paper);
      color: var(--ink);
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      max-width: 1280px;
      margin: auto;
      min-height: 94px;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .2px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand:before {
      content: none;
    }

    .brand small {
      display: block;
      font: 12px var(--mono);
      letter-spacing: 3px;
      margin-top: 8px;
      color: #7890aa;
    }

    nav {
      display: flex;
      gap: 28px;
      font-size: 13px;
    }

    nav a {
      color: #aabbd0;
    }

    nav a:hover {
      color: var(--green);
    }

    .pill {
      border: 1px solid #35616b;
      border-radius: 6px;
      padding: 13px 19px;
      color: var(--green);
      background: #163a3a30;
    }

    .hero {
      max-width: 1280px;
      margin: auto;
      padding: 80px 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 56px;
      align-items: center;
    }

    .eyebrow {
      font: 12px var(--mono);
      letter-spacing: 2.2px;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .eyebrow:before {
      content: '';
      height: 6px;
      width: 6px;
      background: var(--green);
      box-shadow: 0 0 12px #67e8dc80;
    }

    h1 {
      font-size: clamp(40px, 4.7vw, 65px);
      letter-spacing: 1px;
      line-height: 1.4;
      font-weight: 700;
      margin: 26px 0;
    }

    h1 em {
      font-style: normal;
      color: var(--green);
    }

    p {
      font-size: 14px;
      line-height: 1.95;
      color: var(--muted);
    }

    .hero p {
      max-width: 440px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 30px;
    }

    .primary {
      display: flex;
      gap: 30px;
      padding: 16px 24px;
      background: var(--green);
      border: 1px solid var(--green);
      border-radius: 5px;
      color: #082022;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 0 35px #67e8dc16;
    }

    .primary:hover {
      background: #a0fff2;
    }

    .secondary {
      font-size: 14px;
      padding: 14px;
      color: #b0c2d9;
    }

    .visual {
      position: relative;
      min-width: 0;
      min-height: 440px;
      border: 1px solid #294357;
      border-radius: 14px;
      background: linear-gradient(145deg, #102337e0, #0a1223);
      box-shadow: 0 25px 90px #0006, 0 0 70px #43dddb0b;
      overflow: hidden;
    }

    .windowbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 16px 20px;
      border-bottom: 1px solid #243950;
      font: 12px var(--mono);
      color: #8b9db7;
    }

    .dot {
      height: 6px;
      width: 6px;
      border-radius: 50%;
      background: #45607b;
    }

    .dot:first-child {
      background: #67e8dc;
    }

    .windowbar .path {
      margin-left: 10px;
      letter-spacing: 1px;
    }

    .windowbar .live {
      margin-left: auto;
      color: var(--green);
    }

    .circuit {
      width: 100%;
      height: 255px;
      display: block;
      min-width: 260px;
    }

    .terminal {
      margin: 0 22px 22px;
      padding: 17px 18px;
      border: 1px solid #264256;
      border-radius: 6px;
      background: #070f1e;
      font: 12px/1.9 var(--mono);
      color: #9db0c8;
    }

    .terminal .cyan {
      color: #67e8dc;
    }

    .terminal .purple {
      color: #bea5fc;
    }

    .terminal .dim {
      color: #67839c;
    }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 12px;
      background: #67e8dc;
      vertical-align: middle;
      animation: blink 1.3s steps(1) infinite;
    }

    .ribbon {
      display: flex;
      justify-content: center;
      gap: 65px;
      padding: 23px 24px;
      border-block: 1px solid var(--line);
      background: #0c152280;
      font: 12px var(--mono);
      letter-spacing: 1px;
      color: #9bacc2;
    }

    .ribbon b {
      color: var(--green);
      font-weight: 400;
    }

    .ribbon .sep {
      color: #344962;
    }

    section {
      max-width: 1280px;
      margin: auto;
      padding: 70px 40px;
    }

    .sectionhead {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 25px;
      margin-bottom: 32px;
    }

    h2 {
      font-size: 30px;
      font-weight: 500;
      line-height: 1.5;
      margin: 12px 0 0;
    }

    .sectionhead p {
      margin: 0;
      font-size: 13px;
    }

    .catalog-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .search-label {
      display: grid;
      gap: 10px;
      font-size: 12px;
      color: #9eafc6;
      max-width: 450px;
      width: 100%;
    }

    .catalog-toolbar input,
    .catalog-settings input {
      padding: 14px 16px;
      min-width: 0;
      width: 100%;
      color: var(--ink);
      background: #0c1728;
      border: 1px solid #2a3d57;
      border-radius: 6px;
      outline: none;
    }

    .catalog-toolbar input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px #67e8dc14;
    }

    .catalog-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .catalog-toolbar button,
    .catalog-settings button {
      padding: 13px 20px;
      border: 1px solid #2e6c70;
      background: #123236;
      color: #8df4e8;
      border-radius: 5px;
      white-space: nowrap;
      font-size: 12px;
    }

    .catalog-toolbar button:hover {
      background: #19474a;
    }

    .catalog-toolbar button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #home-shortcuts {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
      max-width: 50%;
    }

    #home-shortcuts a {
      font-size: 13px;
      color: var(--green);
      text-decoration: underline;
      text-underline-offset: 5px;
      overflow-wrap: anywhere;
    }

    #home-shortcuts a:hover {
      color: #d4fff9;
    }

    #catalog-status {
      font: 12px/1.9 var(--mono);
      color: #7f95af;
      min-height: 23px;
      margin: 18px 0;
    }

    .filters {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin: 22px 0;
    }

    .filters button {
      padding: 11px 19px;
      background: #0b1524;
      border: 1px solid #2b3b53;
      border-radius: 5px;
      font-size: 13px;
      color: #a8b7cd;
    }

    .filters button.active {
      background: #17373a;
      color: #95fff0;
      border-color: #4b9994;
    }

    .catalog-count {
      font: 12px var(--mono);
      color: #7d92ac;
      margin: 24px 0;
    }

    .unit-group {
      margin-bottom: 30px;
    }

    .unit-title {
      font-size: 15px;
      font-weight: 500;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .unit-title:before {
      content: '//';
      color: #55c4bd;
      font: 14px var(--mono);
    }

    .course-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .course-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      padding: 23px;
      border: 1px solid #22364d;
      border-radius: 7px;
      background: linear-gradient(115deg, #101e31, #0c1727);
      overflow-wrap: anywhere;
      transition: border-color .2s, transform .2s;
    }

    .course-link:hover {
      border-color: #59b5ae;
      transform: translateY(-2px);
    }

    .course-link strong {
      font-size: 14px;
      font-weight: 500;
    }

    .course-link > span {
      color: var(--green);
      font-size: 19px;
    }

    .course-link p {
      font-size: 12px;
      margin: 7px 0 0;
    }

    .catalog-empty {
      padding: 30px;
      background: #101d2d;
      border: 1px dashed #2d435b;
      border-radius: 6px;
    }

    .catalog-settings {
      margin-top: 22px;
      border-top: 1px solid var(--line);
      padding-top: 18px;
      font-size: 12px;
    }

    .catalog-settings summary {
      cursor: pointer;
      color: var(--green);
    }

    .catalog-settings p {
      font-size: 12px;
    }

    .catalog-settings form {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .catalog-settings input {
      flex: 1;
      min-width: 200px;
    }

    [hidden] {
      display: none !important;
    }

    .about {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 60px;
      padding: 45px;
      border: 1px solid #273d55;
      background: linear-gradient(120deg, #112235, #0d1829);
      border-radius: 12px;
    }

    .monogram {
      min-height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #284656;
      background: radial-gradient(circle, #123e4680, transparent 70%), repeating-linear-gradient(0deg, transparent, transparent 23px, #4c9eab0b 24px);
      border-radius: 7px;
      font: 70px var(--mono);
      color: var(--green);
    }

    .monogram:before {
      content: '<';
      color: #315467;
      font-size: 25px;
      align-self: flex-start;
      margin-left: 32px;
    }

    .monogram:after {
      content: '/>';
      color: #315467;
      font-size: 25px;
      align-self: flex-end;
      margin-right: 30px;
    }

    .about p {
      font-size: 14px;
    }

    .meta {
      font-size: 12px;
      color: #91c8c9;
      line-height: 2;
    }

    .journey {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }

    .journey article {
      padding: 20px 0;
    }

    .journey small {
      font: 12px var(--mono);
      letter-spacing: 1.8px;
      color: #719baf;
    }

    .journey h3 {
      font-size: 22px;
      font-weight: 500;
      line-height: 1.6;
    }

    footer {
      max-width: 1280px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 30px 40px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: #7890aa;
    }

    footer strong {
      color: #b2c8de;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid #a8fff2;
      outline-offset: 5px;
    }

    dialog {
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      max-width: 600px;
      padding: 30px;
    }

    dialog::backdrop {
      background: #000a;
    }

    dialog button {
      color: #081f24;
      background: var(--green);
      border: 0;
      padding: 12px 20px;
      border-radius: 5px;
    }

    dialog li {
      line-height: 2;
      color: var(--muted);
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
      .cursor {
        animation: none;
      }
      .course-link {
        transition: none;
      }
    }

    @media (max-width: 900px) {
      header {
        padding: 22px 24px;
        flex-wrap: wrap;
      }
      .hero {
        padding: 55px 24px;
        gap: 35px;
      }
      h1 {
        font-size: 44px;
      }
      .visual {
        min-height: 410px;
      }
      .windowbar {
        padding: 14px 12px;
      }
      .windowbar .path {
        font-size: 12px;
      }
      .about {
        gap: 35px;
        padding: 30px;
      }
    }

    @media (max-width: 700px) {
      header {
        gap: 20px;
      }
      .brand {
        font-size: 20px;
      }
      header nav {
        order: 3;
        width: 100%;
        justify-content: space-between;
        gap: 14px;
      }
      .pill {
        font-size: 12px !important;
        padding: 10px;
      }
      .hero {
        grid-template-columns: 1fr;
        padding: 45px 24px;
        gap: 35px;
      }
      .hero h1 {
        font-size: 43px;
      }
      .visual {
        min-height: 420px;
      }
      .ribbon {
        gap: 15px;
        font-size: 12px;
        letter-spacing: 0;
      }
      section {
        padding: 48px 24px;
      }
      .sectionhead {
        display: block;
      }
      .sectionhead h2 {
        font-size: 26px;
      }
      .sectionhead p {
        margin-top: 14px;
      }
      .catalog-toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .catalog-actions {
        gap: 16px;
      }
      .course-list {
        grid-template-columns: 1fr;
      }
      .about {
        grid-template-columns: 1fr;
        gap: 25px;
        padding: 27px;
      }
      .monogram {
        min-height: 180px;
        font-size: 60px;
      }
      .journey {
        grid-template-columns: 1fr;
        gap: 0;
      }
      footer {
        padding: 25px 24px;
        flex-wrap: wrap;
      }
      .catalog-settings form {
        align-items: stretch;
        flex-direction: column;
      }
      .terminal {
        font-size: 12px;
      }
    }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin: 30px 0;
    }

    .subject-button {
      position: relative;
      padding: 22px 17px;
      text-align: left;
      background: #0d1828;
      border: 1px solid #273b53;
      border-radius: 9px;
      color: var(--ink);
      min-height: 140px;
      transition: border-color .2s, background .2s;
    }

    .subject-button:hover {
      border-color: #468b8b;
    }

    .subject-button.active {
      border-color: #63d7cb;
      background: linear-gradient(145deg, #173e41, #101f30);
      box-shadow: 0 0 25px #67e8dc0b;
    }

    .subject-button.active:after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 20px;
      right: 20px;
      height: 2px;
      background: var(--green);
    }

    .subject-icon {
      display: block;
      font: 20px var(--mono);
      color: var(--green);
      margin-bottom: 17px;
    }

    .subject-name {
      display: block;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.6;
    }

    .subject-state {
      display: block;
      font: 12px var(--mono);
      color: #859bb5;
      margin-top: 9px;
    }

    .course-workspace {
      border: 1px solid #263b53;
      border-radius: 12px;
      padding: 30px;
      background: #0b1523;
    }

    .course-overview {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
      margin-bottom: 25px;
    }

    .course-overview h3 {
      font-size: 27px;
      margin: 12px 0 8px;
    }

    .course-overview p {
      font-size: 13px;
      margin: 0;
      max-width: 550px;
    }

    .subject-metrics {
      display: flex;
      gap: 24px;
      flex-shrink: 0;
    }

    .metric {
      display: grid;
      gap: 7px;
    }

    .metric b {
      font: 27px var(--mono);
      color: #a2f6e8;
    }

    .metric span {
      font-size: 12px;
      color: #8ea4be;
    }

    .chapter-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 22px 0 16px;
    }

    .chapter-controls p {
      margin: 0;
      font-size: 12px;
      color: #849bb6;
    }

    .chapter-controls button {
      border: 0;
      background: none;
      color: #72dccf;
      font-size: 12px;
      padding: 7px 0;
    }

    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    .chapter-card {
      border: 1px solid #263c56;
      border-radius: 9px;
      background: linear-gradient(145deg, #112035, #0d192a);
      overflow: hidden;
    }

    .chapter-card[open] {
      border-color: #35646b;
    }

    .chapter-card summary {
      list-style: none;
      cursor: pointer;
      padding: 22px;
      position: relative;
    }

    .chapter-card summary::-webkit-details-marker {
      display: none;
    }

    .chapter-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .chapter-number {
      font: 12px var(--mono);
      color: #74d7cd;
      letter-spacing: 1.5px;
    }

    .chapter-toggle {
      font-size: 20px;
      color: #6e8ca7;
      font-weight: 400;
    }

    .chapter-card[open] .chapter-toggle {
      transform: rotate(45deg);
    }

    .chapter-card h4 {
      font-size: 17px;
      line-height: 1.65;
      font-weight: 500;
      margin: 0 0 12px;
      min-height: 56px;
    }

    .chapter-card summary p {
      font-size: 12px;
      line-height: 1.85;
      margin: 0;
      min-height: 44px;
      color: #8ba0bb;
    }

    .chapter-meta {
      display: flex;
      gap: 12px;
      margin-top: 17px;
      font-size: 12px;
      color: #8497af;
    }

    .chapter-meta .ready {
      color: #83cbbb;
    }

    .unit-list {
      list-style: none;
      margin: 0;
      padding: 0 18px 10px;
      border-top: 1px solid #263b52;
    }

    .unit-item {
      padding: 15px 2px;
      border-bottom: 1px solid #20334a;
    }

    .unit-item:last-child {
      border-bottom: 0;
    }

    .unit-heading {
      display: flex;
      gap: 10px;
      align-items: baseline;
      line-height: 1.75;
    }

    .unit-id {
      font: 12px var(--mono);
      color: #6ac4c3;
      flex-shrink: 0;
    }

    .unit-name {
      font-size: 12px;
      color: #d6e3f3;
    }

    .unit-heading a {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .unit-heading a:hover {
      color: #9affed;
    }

    .unit-pending {
      font-size: 12px;
      color: #71849b;
      display: block;
      margin: 6px 0 0 30px;
    }

    .resource-links {
      display: grid;
      gap: 7px;
      margin: 10px 0 0 30px;
    }

    .resource-links a {
      font-size: 12px;
      line-height: 1.7;
      color: #80dfd1;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid #2c4c5a;
      border-radius: 4px;
      background: #11313750;
    }

    .resource-links a:hover {
      background: #174347;
    }

    .course-empty {
      grid-column: 1 / -1;
      padding: 45px 24px;
      border: 1px dashed #304c65;
      border-radius: 9px;
      text-align: center;
      background: radial-gradient(ellipse at top, #17404950, transparent 70%);
    }

    .course-empty .empty-code {
      font: 32px var(--mono);
      color: #4aa49e;
    }

    .course-empty h4 {
      font-size: 19px;
      font-weight: 500;
      margin: 18px 0 10px;
    }

    .course-empty p {
      font-size: 13px;
      max-width: 480px;
      margin: auto;
    }

    .chapter-card summary:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: -4px;
    }

    @media (max-width: 1050px) {
      .subject-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .chapter-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .subject-button {
        min-height: 125px;
      }
      .course-workspace {
        padding: 24px;
      }
    }

    @media (max-width: 700px) {
      .subject-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .subject-button {
        min-height: 122px;
        padding: 17px;
      }
      .subject-icon {
        margin-bottom: 11px;
      }
      .subject-name {
        font-size: 13px;
      }
      .subject-grid .subject-button:last-child {
        grid-column: 1 / -1;
        min-height: 100px;
      }
      .course-workspace {
        padding: 19px;
      }
      .course-overview {
        align-items: start;
        flex-direction: column;
        gap: 22px;
      }
      .course-overview h3 {
        font-size: 24px;
      }
      .subject-metrics {
        gap: 24px;
      }
      .metric b {
        font-size: 23px;
      }
      .chapter-grid {
        grid-template-columns: 1fr;
      }
      .chapter-card h4,
      .chapter-card summary p {
        min-height: 0;
      }
      .chapter-card summary {
        padding: 20px;
      }
      .chapter-controls {
        align-items: start;
      }
      .chapter-controls p {
        max-width: 65%;
        line-height: 1.9;
      }
      #home-shortcuts {
        max-width: 100%;
        width: 100%;
        margin-top: 3px;
      }
      .course-empty {
        padding: 32px 15px;
      }
    }

    .brand-mascot {
      display: block;
      flex: 0 0 50px;
      width: 50px;
      height: 56px;
      border-radius: 13px;
      background-color: #fff;
      background-image: var(--miyuki-character);
      background-repeat: no-repeat;
      background-size: 240px 240px;
      background-position: -190px -183px;
      box-shadow: 0 0 0 1px #67e8dc50, 0 0 20px #67e8dc15;
    }

    .brand-wordmark {
      display: block;
    }

    .brand-wordmark small {
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .brand {
        gap: 9px;
        font-size: 18px;
      }
      .brand-mascot {
        flex-basis: 46px;
        width: 46px;
        height: 52px;
        background-size: 223px 223px;
        background-position: -177px -170px;
      }
      .brand-wordmark small {
        letter-spacing: 1px;
        font-size: 12px;
      }
    }
